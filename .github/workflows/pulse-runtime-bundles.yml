name: Pulse runtime bundles

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            artifact: win32-x64
          - runner: ubuntu-24.04
            artifact: linux-x64
          - runner: ubuntu-24.04-arm
            artifact: linux-arm64
          - runner: macos-14
            artifact: darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install complete proxy and bundler
        run: python -m pip install ".[proxy]" "pyinstaller==6.16.0"
      - name: Build and smoke-test bundle
        run: python scripts/build_pulse_bundle.py
      - uses: actions/upload-artifact@v4
        with:
          name: headroom-pulse-${{ matrix.artifact }}
          path: |
            dist/pulse/*.zip
            dist/pulse/*.json
          if-no-files-found: error
